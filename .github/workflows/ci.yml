name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # shellcheck, jq and node come with GitHub's Ubuntu runner image.
      - name: Release checks (lint, tests, hygiene)
        run: tools/release-check --ci
