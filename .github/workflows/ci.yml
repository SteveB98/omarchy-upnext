name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install shellcheck and jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Release checks (lint, tests, hygiene)
        run: tools/release-check --ci
